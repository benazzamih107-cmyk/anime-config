name: Check mirror domains

on:
  schedule:
    - cron: '0 */6 * * *'   # كل 6 ساعات
  workflow_dispatch:         # تشغيل يدوي من تبويب Actions

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # لإضافة موقع جديد: أضف مفتاحه في domains.json وسطرًا هنا بصيغة
      #   KEY|علامة-نصية-تكون-في-صفحة-الموقع الحقيقي (أحرف صغيرة، | للبدائل)
      - name: Follow redirects and update any changed domain
        run: |
          set -u
          FILE=domains.json
          CHANGED=0
          UA='Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125 Mobile Safari/537.36'

          declare -A SITES=(
            [SITE]="witanime|ويت ?انمي"
            [SITE2]="anime4up|أنمي ?ويب|انمي ?فور ?اب"
            [SITE3]="ristoanime|ريستو ?انمي"
            [RS_HOME]="ristoanime|ريستو ?انمي|witaanime"
          )

          git config user.name "mirror-check-bot"
          git config user.email "noreply@anthropic.com"

          # probe URL MARKER FILE  → يطبع origin النهائي إن كانت الاستجابة 2xx وفيها علامة الموقع، وإلا لا يطبع شيئًا
          probe() {
            local url="$1" marker="$2" out="$3" res code eff
            res=$(curl -sL -A "$UA" -o "$out" --max-time 30 -w '%{http_code} %{url_effective}' "$url" || true)
            code="${res%% *}"; eff="${res#* }"
            case "$code" in 2*) ;; *) return 0;; esac
            grep -qiP "$marker" "$out" || return 0
            echo "$eff" | grep -oP '^https?://[^/]+' || true
          }

          for NAME in "${!SITES[@]}"; do
            MARKER="${SITES[$NAME]}"
            OLD=$(jq -r --arg k "$NAME" '.[$k] // empty' "$FILE" || true)
            if [ -z "$OLD" ]; then
              echo "[$NAME] غير موجود في domains.json — تجاهلته."
              continue
            fi
            OLD_BASE="${OLD%/}"
            echo "[$NAME] الحالي: $OLD"

            # 1) النطاق الحالي (مع اتباع التحويل)  2) المرايا الاحتياطية بالترتيب
            NEW_ORIGIN=$(probe "$OLD_BASE/" "$MARKER" "/tmp/page_$NAME.html")
            if [ -z "$NEW_ORIGIN" ]; then
              echo "[$NAME] النطاق الحالي لا يعمل — أجرّب المرايا."
              while read -r MIRROR; do
                [ -z "$MIRROR" ] && continue
                NEW_ORIGIN=$(probe "${MIRROR%/}/" "$MARKER" "/tmp/mirror_$NAME.html")
                if [ -n "$NEW_ORIGIN" ]; then echo "[$NAME] مرآة سليمة: $MIRROR -> $NEW_ORIGIN"; break; fi
              done < <(jq -r --arg k "$NAME" '.MIRRORS[$k][]? // empty' "$FILE")
            fi

            if [ -z "$NEW_ORIGIN" ]; then
              echo "[$NAME] لا النطاق الحالي ولا المرايا تعمل — يلزم تدخل يدوي."
              continue
            fi
            if [ "$NEW_ORIGIN" = "$OLD_BASE" ]; then
              echo "[$NAME] لم يتغيّر."
              continue
            fi

            VALUE="$NEW_ORIGIN"
            case "$OLD" in */) VALUE="$NEW_ORIGIN/";; esac
            echo "[$NAME] تغيّر: $OLD -> $VALUE"
            # نحافظ على النطاق القديم ضمن المرايا ليُجرَّب لاحقًا إن لزم
            jq --arg k "$NAME" --arg v "$VALUE" --arg o "$OLD" \
              '.[$k]=$v | .MIRRORS[$k]=(((.MIRRORS[$k] // []) + [$o]) | map(select(. != $v)) | unique)' \
              "$FILE" > /tmp/domains.new && mv /tmp/domains.new "$FILE"
            CHANGED=1
          done

          if [ "$CHANGED" = "1" ]; then
            git add "$FILE"
            git commit -m "Auto-update mirror domains" -m "Detected by the scheduled check (HTTP redirect from the previous domain, verified against site markers)."
            git push
          else
            echo "لا تغييرات."
          fi
